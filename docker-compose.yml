services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ocr-api-v2

    expose:
      - "${API_CONTAINER_PORT}"

    environment:
      # --- Tesseract / OCR ---
      TESSDATA_PREFIX: "${TESSDATA_PREFIX}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB}"
      OCR_MAX_WORKERS: "${OCR_MAX_WORKERS}"
      OCR_PDF_DPI: "${OCR_PDF_DPI}"
      OCR_MAX_IMAGE_DIM: "${OCR_MAX_IMAGE_DIM}"
      OCR_WORKDIR: "${OCR_WORKDIR}"
      OCR_JOB_TTL_MINUTES: "${OCR_JOB_TTL_MINUTES}"

      # --- Multi-worker (Gunicorn) ---
      API_PROCESS_WORKERS: "${API_PROCESS_WORKERS}"
      API_CONTAINER_PORT: "${API_CONTAINER_PORT}"

      # --- Shared job state ---
      REDIS_URL: "${REDIS_URL}"

      # --- Gemini (BACKEND-CONTROLLED ONLY) ---
      GEMINI_ENABLED: "${GEMINI_ENABLED}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GEMINI_MODEL: "${GEMINI_MODEL}"

      # --- Runtime ---
      ENVIRONMENT: "${ENVIRONMENT}"
      LOG_LEVEL: "${LOG_LEVEL}"

    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ['API_CONTAINER_PORT'] + '/ready')"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: unless-stopped

    depends_on:
      - redis

    networks:
      - ocr-internal

    security_opt:
      - "no-new-privileges:true"

    # Shared volume so any worker can read job output files.
    volumes:
      - ocr-data:/tmp/ocr-api

    deploy:
      resources:
        limits:
          memory: "${API_MEMORY_LIMIT}"

  redis:
    image: redis:7-alpine
    container_name: ocr-redis
    restart: unless-stopped
    networks:
      - ocr-internal
    security_opt:
      - "no-new-privileges:true"

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: ocr-client-v2

    ports:
      - "${CLIENT_HOST_PORT}:${CLIENT_CONTAINER_PORT}"

    environment:
      OCR_API_URL: "${OCR_API_URL}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB}"
      API_CONNECT_TIMEOUT: "${API_CONNECT_TIMEOUT}"
      API_READ_TIMEOUT: "${API_READ_TIMEOUT}"
      API_HEALTH_RETRIES: "${API_HEALTH_RETRIES}"

    depends_on:
      - api

    restart: unless-stopped

    networks:
      - ocr-internal

    security_opt:
      - "no-new-privileges:true"

networks:
  ocr-internal:
    driver: bridge

volumes:
  ocr-data:
